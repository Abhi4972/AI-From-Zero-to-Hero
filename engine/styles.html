<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: a home page of phases with a progress route, a chapter page listing its lessons, and one lesson per view; a contents rail of phases beside them.
   Identity: a systems-map look. Cool slate neutrals, an oxide-copper accent for the reader's path, mono for real identifiers. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --surface-2: #e9ebef; --ink: #171a21; --muted: #566070;
  --line: #d9dde4; --line-strong: #b7bfcb;
  --accent: #b24a1d; --accent-ink: #ffffff; --accent-soft: #f7e4da;
  --warn: #965605; --warn-soft: #fbeedb;
  --prod: #474d9a; --prod-soft: #e7e8f7;
  --ag: #9a3468; --ag-soft: #f8e7f0;
  --ok: #24753a; --ok-soft: #dff1e3; --bad: #b0352a; --bad-soft: #f8e1de;
  --code-bg: #121b20; --code-ink: #dbe5e9; --code-muted: #7d9099;
  --c-kw: #f0a35e; --c-str: #9fd38a; --c-fn: #7fc6d6; --c-num: #e4c06b; --c-com: #6f8590; --c-attr: #c9a3f0;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --rail: 304px;
  --step--1: 0.84rem; --step-0: 1.0625rem; --step-1: 1.25rem; --step-2: 1.6rem; --step-3: 2.3rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --surface: #161a20; --surface-2: #1e232b; --ink: #e4e7ec; --muted: #98a2b1;
  --line: #262c35; --line-strong: #3b4452;
  --accent: #f0915f; --accent-ink: #2a1206; --accent-soft: #3a2116;
  --warn: #efb260; --warn-soft: #30240f;
  --prod: #a9adf3; --prod-soft: #22254a;
  --ag: #f29cc6; --ag-soft: #351726;
  --ok: #72cf89; --ok-soft: #12301b; --bad: #f2867a; --bad-soft: #3a1714;
  --code-bg: #090e11; --code-ink: #d7e2e6; --code-muted: #6f838c;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #161a20; --surface-2: #1e232b; --ink: #e4e7ec; --muted: #98a2b1;
  --line: #262c35; --line-strong: #3b4452;
  --accent: #f0915f; --accent-ink: #2a1206; --accent-soft: #3a2116;
  --warn: #efb260; --warn-soft: #30240f;
  --prod: #a9adf3; --prod-soft: #22254a;
  --ag: #f29cc6; --ag-soft: #351726;
  --ok: #72cf89; --ok-soft: #12301b; --bad: #f2867a; --bad-soft: #3a1714;
  --code-bg: #090e11; --code-ink: #d7e2e6; --code-muted: #6f838c;
  color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; }

/* Reading-progress hairline */
.readbar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; z-index: 40; pointer-events: none; }
.readbar > i { display: block; height: 100%; width: 0; background: var(--accent); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; min-height: 54px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.08rem; letter-spacing: -0.01em; white-space: nowrap; color: var(--ink); text-decoration: none; }
.brand b { color: var(--accent); font-weight: 800; }
.menu-btn { display: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 10px; font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; cursor: pointer; }
.tb-where { min-width: 0; flex: 1; font-family: var(--font-display); font-size: 0.86rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-progress { margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink);
  font-family: var(--font-display); font-size: 0.86rem; font-weight: 600; padding: 4px 10px 4px 6px; border-radius: 99px; border: 1px solid var(--line); }
.tb-progress:hover { border-color: var(--accent); }
.tb-progress small { color: var(--muted); font-weight: 500; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.ring { width: 26px; height: 26px; transform: rotate(-90deg); flex: none; }
.ring circle { fill: none; stroke-width: 4; }
.ring .trk { stroke: var(--surface-2); }
.ring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .35s ease; }
.ring.full .val { stroke: var(--ok); }

/* Shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
.rail { position: sticky; overscroll-behavior: contain; top: calc(env(safe-area-inset-top, 0px) + 55px); height: calc(100vh - 55px - env(safe-area-inset-top, 0px));
  overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 14px 40px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 12px; font-family: var(--font-display); }
.rail-home { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 0.92rem; margin-bottom: 8px; }
.rail-home:hover, .rail-home.active { background: var(--surface-2); }
.rail-home svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg);
  color: var(--ink); font: 500 0.9rem var(--font-display); }
.search-note { font-size: 0.78rem; color: var(--muted); min-height: 1.2em; margin: 6px 2px 4px; }
.sr { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.sr:hover { background: var(--surface-2); }
.sr-t { display: block; font-size: 0.88rem; font-weight: 600; line-height: 1.3; }
.sr-t span { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); margin-right: 6px; font-weight: 400; }
.sr-s { display: block; font-size: 0.78rem; color: var(--muted); line-height: 1.35; margin-top: 2px; font-family: var(--font-body); }
.sr-s b { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.nav-part-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 700; padding: 14px 8px 5px; }
.nav-ch { width: 100%; display: grid; grid-template-columns: 22px 30px minmax(0,1fr) auto; gap: 7px; align-items: center; text-align: left;
  padding: 7px 8px; border: 0; background: none; color: var(--ink); border-radius: 8px; cursor: pointer; font-family: var(--font-display); font-size: 0.9rem; line-height: 1.25; }
.nav-ch:hover { background: var(--surface-2); }
.nav-ch .ring { width: 20px; height: 20px; }
.nav-ch-code { font-family: var(--font-mono); font-size: 0.74rem; color: var(--accent); font-weight: 600; }
.nav-ch-title { font-weight: 600; }
.nav-ch-count { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-ch.current { background: var(--surface-2); }
.nav-ch[aria-expanded="true"] .nav-ch-title { font-weight: 700; }
.nav-lessons { list-style: none; margin: 2px 0 6px 18px; padding: 0 0 0 10px; border-left: 2px solid var(--line); }
.nav-ch-open { display: block; padding: 5px 8px; font-size: 0.78rem; color: var(--accent); text-decoration: none; font-weight: 600; }
.nav-ch-open:hover { text-decoration: underline; }
.nav-link { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 8px; align-items: baseline;
  padding: 5px 8px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 0.86rem; line-height: 1.3; }
.nav-link:hover { background: var(--surface-2); }
.nav-link.active { background: var(--accent-soft); }
.nav-link.active .nav-title { font-weight: 700; }
.nav-link.off { opacity: 0.5; }
.nav-num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-right: 5px; }
.nav-min { font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-done { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); align-self: center; position: relative; }
.nav-link.done .nav-done { background: var(--ok); border-color: var(--ok); }
.nav-link.done .nav-done::after { content: ""; position: absolute; left: 3px; top: 0.5px; width: 3px; height: 6px; border: solid var(--surface); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }

/* Main */
main { min-width: 0; padding-block: 34px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.module { min-width: 0; }
.m-head { margin-bottom: 26px; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.eyebrow { font-family: var(--font-display); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; }
.eyebrow .dot { color: var(--line-strong); }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.015em; text-wrap: balance; line-height: 1.15; }
h1 { font-size: var(--step-3); font-weight: 800; margin: 4px 0 0; }
.prose h2 { font-size: var(--step-2); font-weight: 700; margin: 2.2em 0 0.5em; }
.prose h3 { font-size: var(--step-1); font-weight: 700; margin: 1.8em 0 0.4em; }
.prose p, .prose li { max-width: 70ch; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li { margin: 0.25em 0; }
.prose strong { font-weight: 600; }
.prose :not(pre) > code { font-family: var(--font-mono); font-size: 0.84em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }

/* Tables */
.tbl { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; line-height: 1.45; }
th { font-family: var(--font-display); text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* Code */
.code { position: relative; margin: 1.1em 0; }
.code pre { margin: 0; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 16px 18px; overflow-x: auto;
  font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.6; tab-size: 4; }
.code pre code { font-family: inherit; background: none; padding: 0; }
.copy { position: absolute; top: 8px; right: 8px; border: 1px solid #ffffff2b; background: #ffffff14; color: var(--code-ink);
  border-radius: 6px; padding: 3px 9px; font: 600 0.72rem var(--font-display); cursor: pointer; opacity: 0.75; }
.copy:hover, .copy:focus-visible { opacity: 1; }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag { color: var(--c-kw); }
.hljs-string, .hljs-regexp, .hljs-addition { color: var(--c-str); }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--c-fn); }
.hljs-number, .hljs-symbol { color: var(--c-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--c-com); font-style: italic; }
.hljs-attr, .hljs-attribute, .hljs-params, .hljs-variable, .hljs-type, .hljs-property { color: var(--c-attr); }
.hljs-deletion { color: var(--bad); }

/* Callouts */
.co { margin: 1.5em 0; padding: 14px 18px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.co-label { font-family: var(--font-display); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.co-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin-top: 2px; }
.co-body { font-size: 0.97rem; }
.co-body > :first-child { margin-top: 8px; }
.co-prereq { background: var(--surface); border-color: var(--line-strong); }
.co-prereq .co-label, .co-checked .co-label { color: var(--muted); }
.co-checked { background: var(--surface); border-style: dashed; }
.co-why { background: var(--ag-soft); border-color: transparent; border-left: 4px solid var(--ag); }
.co-why .co-label { color: var(--ag); }
.co-plain { background: var(--surface); border-color: transparent; border-left: 4px solid var(--accent); }
.co-plain .co-label { color: var(--accent); }
.co-read { background: var(--surface); border: 1px solid var(--prod); border-left: 4px solid var(--prod); }
.co-read .co-label { color: var(--prod); }
.co-read .co-label::before { content: "↳ "; }
.co-check { background: var(--warn-soft); border-color: transparent; border-left: 4px solid var(--warn); }
.co-check .co-label { color: var(--warn); }
.co-check ul { list-style: none; padding-left: 0; }
.co-check li { margin: 0 0 12px; }
.ck-no { color: var(--bad); font-weight: 700; }
.ck-yes { color: var(--ok); font-weight: 700; }
.co-fake { background: var(--warn-soft); border-color: transparent; }
.co-fake .co-label { color: var(--warn); }
.co-predict, .co-broken, .co-debugx, .co-modify { background: var(--surface); border: 2px solid var(--accent-soft); }
.co-predict .co-label, .co-modify .co-label { color: var(--accent); }
.co-broken .co-label, .co-debugx .co-label { color: var(--warn); }
.co-broken, .co-debugx { border-color: var(--warn-soft); }
.co-real, .co-replaces { background: var(--prod-soft); border-color: transparent; }
.co-real .co-label, .co-replaces .co-label { color: var(--prod); }
.co-goals { background: var(--accent-soft); border-color: transparent; }
.co-goals .co-label { color: var(--accent); }
.co-warn { background: var(--warn-soft); border-color: transparent; }
.co-warn .co-label { color: var(--warn); }
.co-prod { background: var(--prod-soft); border-color: transparent; }
.co-prod .co-label { color: var(--prod); }
.co-tip .co-label, .co-concept .co-label { color: var(--accent); }
.co-lab { border: 2px dashed var(--accent); background: var(--surface); }
.co-lab .co-label { color: var(--accent); }
.co-lab ol { counter-reset: none; }
.co-api { border-color: var(--line-strong); }
.co-api .co-label { color: var(--accent); }
.co-api .tbl { margin: 10px 0 12px; }
.co-api td:first-child { width: 30%; }
.co-api td:first-child code { white-space: normal; overflow-wrap: anywhere; }
.co-terms { background: var(--prod-soft); border-color: transparent; }
.co-terms .co-label { color: var(--prod); }
.co-terms .tbl { margin: 10px 0 12px; background: var(--surface); }
.co-terms td:first-child { width: 26%; font-weight: 600; }
mark.term { background: var(--prod-soft); color: inherit; padding: 0 3px; border-radius: 4px; box-shadow: inset 0 -1.5px 0 var(--prod); scroll-margin-top: 120px; }
.cx { text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: help; border-radius: 3px; }
.cx:hover, .cx:focus-visible { background: var(--prod-soft); outline: none; }
.cx-later { text-decoration-color: var(--accent); }
.cx-pill { display: inline-block; margin: 0 2px 0 4px; padding: 0 7px; font-size: 0.72em; font-weight: 600; line-height: 1.55; letter-spacing: 0.01em; white-space: nowrap; vertical-align: 0.12em; color: var(--accent); background: var(--accent-soft, var(--prod-soft)); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 999px; text-decoration: none; }
a.cx-pill:hover { background: var(--accent); color: #fff; }
.later-box { margin: 14px 0 18px; border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 12px; background: var(--surface); padding: 0 14px; }
.later-box > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 10px 0; font-size: 0.9rem; }
.later-box > summary::-webkit-details-marker { display: none; }
.later-box > summary::before { content: "▸"; color: var(--accent); font-size: 0.8em; }
.later-box[open] > summary::before { content: "▾"; }
.later-box .lb-t { font-weight: 650; }
.later-box .lb-n { font-size: 0.75rem; font-weight: 700; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 999px; padding: 0 7px; }
.later-box .lb-names { color: var(--muted); flex: 1 1 240px; min-width: 0; }
.later-box p { margin: 2px 0 10px; font-size: 0.9rem; color: var(--muted); }
.later-box .tbl { margin: 0 0 14px; }
.later-box td:first-child { font-weight: 600; width: 24%; }
.later-box td:last-child { white-space: nowrap; }
#cx-pop { position: absolute; z-index: 60; max-width: min(340px, calc(100vw - 24px)); background: var(--surface); color: var(--ink, inherit); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); padding: 12px 14px; font-size: 0.9rem; line-height: 1.45; }
#cx-pop b { display: block; margin-bottom: 4px; }
#cx-pop .cx-where { display: block; margin-top: 8px; font-size: 0.82rem; color: var(--muted); }
#cx-pop .cx-where a { font-weight: 600; }
#cx-pop .cx-note { display: block; margin-top: 6px; font-size: 0.82rem; color: var(--accent); }
mark.term.flash { outline: 2px solid var(--prod); outline-offset: 2px; }
.co-terms a.term-jump { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--prod); }
.co-terms a.term-jump::after { content: " ↓"; color: var(--prod); font-weight: 700; }
.co-terms a.term-jump:hover { color: var(--prod); }
.co-agentic { background: var(--ag-soft); border-color: transparent; border-left: 4px solid var(--ag); }
.co-agentic .co-label { color: var(--ag); }
.co-agentic .co-label::before { content: "\25C6  "; }
.amap td:first-child { white-space: nowrap; font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; }
.amap .term-jump::after { content: ""; }
.co-practice { background: var(--surface); border: 1px solid var(--line-strong); border-left: 4px solid var(--ink); }
.co-practice .co-label { color: var(--ink); }
.co-practice .co-label::before { content: "\25B2  "; }
.co-platform { background: var(--surface-2); border-color: transparent; }
.co-platform .co-label { color: var(--prod); }
.co-platform .co-label::before { content: "\25A0  "; }
.co-scenario { background: var(--surface); border: 1px solid var(--line-strong); border-left: 4px solid var(--ok); }
.co-scenario .co-label { color: var(--ok); }
.co-scenario .co-label::before { content: "\25C7  "; }
.co-scenario .tbl { margin: 10px 0 12px; }
.co-scenario td:first-child { font-weight: 600; }
.co-field { background: var(--warn-soft); border-color: transparent; border-left: 4px solid var(--warn); }
.co-field .co-label { color: var(--warn); }
.co-field .co-label::before { content: "\25CF  "; }
.co-watch { background: var(--ok-soft); border-color: transparent; border-left: 4px solid var(--ok); }
.co-watch .co-label { color: var(--ok); }
.co-watch .co-label::before { content: "\25B6  "; }
.co-watch ul { margin: 6px 0 4px; }
.co-watch li { margin: 4px 0; }
.co-visual { background: var(--accent-soft); border-color: transparent; border-left: 4px solid var(--accent); }
.co-visual .co-label { color: var(--accent); }
.co-visual .co-label::before { content: "\25C8  "; }
.co-visual li { margin: 4px 0; }
.co-brief { background: var(--surface); border: 1px solid var(--line-strong); border-left: 4px solid var(--warn); }
.co-brief .co-label { color: var(--warn); }
.co-brief .co-label::before { content: "\25A1  "; }
.co-repos { background: var(--surface-2); border-color: transparent; border-left: 4px solid var(--prod); }
.co-repos .co-label { color: var(--prod); }
.co-repos .co-label::before { content: "\2387  "; }
.co-repos ul { margin: 6px 0 4px; }
.co-repos li { margin: 4px 0; }
.co-lgc { background: var(--accent-soft); border-color: transparent; }
.co-lgc .co-label { color: var(--accent); }
.co-run { background: var(--ok-soft); border-color: transparent; }
.co-run .co-label { color: var(--ok); }
.co-run .code { margin: 8px 0 10px; }
.co-run .code pre { font-size: 0.78rem; }
.co-body > p:last-child { margin-bottom: 12px; }

/* Diagrams */
.diagram { margin: 1.6em 0; }
.dg-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.dg { display: block; width: 100%; height: auto; }
.dg text { fill: var(--ink); font-family: var(--font-display); font-size: 13px; }
.dg text.s { fill: var(--muted); font-size: 11.5px; }
.dg text.h { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
.dg text.m { fill: var(--accent); font-family: var(--font-mono); font-size: 12.5px; }
.dg rect.b { fill: var(--surface-2); stroke: var(--line-strong); }
.dg rect.a { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.dg rect.w { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.4; }
.dg rect.p { fill: var(--prod-soft); stroke: var(--prod); stroke-width: 1.2; }
.dg rect.f { fill: none; stroke: var(--line-strong); }
.dg rect.pf { fill: none; stroke: var(--prod); stroke-dasharray: 4 4; }
.dg rect.af { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.dg rect.pb { fill: var(--surface); stroke: var(--prod); fill-opacity: 0.4; }
.dg rect.sf { fill: none; stroke: var(--accent); stroke-dasharray: 5 4; }
.dg .l { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.dg .l.d { stroke-dasharray: 4 4; }
.dg .ahp { fill: var(--muted); }
.dg .sep { stroke: var(--line-strong); stroke-dasharray: 3 5; }
.dg rect.ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.3; }
.dg rect.bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.3; }
.dg rect.chip { fill: var(--surface); stroke: var(--line-strong); }
.dg rect.chipa { fill: var(--accent-soft); stroke: var(--accent); }
.dg rect.chipp { fill: var(--prod-soft); stroke: var(--prod); }
.dg rect.chipk { fill: var(--ok-soft); stroke: var(--ok); }
.dg rect.chipw { fill: var(--warn-soft); stroke: var(--warn); }
.dg rect.chipb { fill: var(--bad-soft); stroke: var(--bad); }
.dg circle.n { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.3; }
.dg circle.na { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.dg circle.np { fill: var(--prod-soft); stroke: var(--prod); stroke-width: 1.5; }
.dg circle.nk { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5; }
.dg circle.nw { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; }
.dg circle.nb { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.5; }
.dg circle.badge { fill: var(--accent); stroke: none; }
.dg text.bw { fill: var(--accent-ink); font-size: 11.5px; font-weight: 700; }
.dg text.t { font-size: 11.5px; }
.dg text.a { fill: var(--accent); font-weight: 600; }
.dg text.p { fill: var(--prod); font-weight: 600; }
.dg text.k { fill: var(--ok); font-weight: 600; }
.dg text.r { fill: var(--bad); font-weight: 600; }
.dg text.w { fill: var(--warn); font-weight: 600; }
.dg text.mono { font-family: var(--font-mono); font-size: 11.5px; }
.dg text.big { font-size: 15px; font-weight: 700; }
.dg .l.a { stroke: var(--accent); stroke-width: 2; }
.dg .l.p { stroke: var(--prod); stroke-width: 2; }
.dg .l.k { stroke: var(--ok); stroke-width: 2; }
.dg .l.r { stroke: var(--bad); stroke-width: 2; }
.dg .l.w { stroke: var(--warn); stroke-width: 2; }
.dg .l.thin { stroke-width: 1; }
.dg .aha { fill: var(--accent); } .dg .ahpp { fill: var(--prod); } .dg .ahk { fill: var(--ok); } .dg .ahr { fill: var(--bad); } .dg .ahw { fill: var(--warn); }
.dg .fa { fill: var(--accent); } .dg .fp { fill: var(--prod); } .dg .fk { fill: var(--ok); } .dg .fr { fill: var(--bad); } .dg .fw { fill: var(--warn); } .dg .fm { fill: var(--muted); }
.dg .grid { stroke: var(--line); stroke-width: 1; }
.dg .axis { stroke: var(--line-strong); stroke-width: 1.2; }
.dg .band { fill: var(--accent-soft); }
.dg .bandp { fill: var(--prod-soft); }
.xfig { margin: 1.6em 0; }
.xfig-frame { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; overflow-x: auto; }
.xfig-frame img { max-width: 100%; height: auto; max-height: 560px; display: inline-block; }
.xfig figcaption { font-family: var(--font-display); font-size: 0.82rem; color: var(--muted); margin-top: 8px; max-width: 78ch; }
.xfig-credit { display: block; margin-top: 2px; font-size: 0.74rem; opacity: 0.9; }
.xfig-credit a { color: inherit; }
.diagram figcaption { font-family: var(--font-display); font-size: 0.82rem; color: var(--muted); margin-top: 8px; max-width: 70ch; }

/* Course map */
.cmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin: 1em 0 1.5em; font-family: var(--font-display); }
.cmap-part { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface); min-width: 0; }
.cmap-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.cmap-plabel { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 800; }
.cmap-pname { font-weight: 700; }
.cmap-hrs { margin-left: auto; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmap ol { list-style: none; margin: 0; padding: 0; }
.cmap li { margin: 0; max-width: none; }
.cmap a { display: flex; gap: 8px; text-decoration: none; color: var(--ink); font-size: 0.88rem; padding: 3px 0; line-height: 1.35; }
.cmap a:hover { color: var(--accent); }
.cmap .num { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); padding-top: 1px; }

/* Quiz */
.qa { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.qa > summary { list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; font-family: var(--font-display); font-weight: 600; line-height: 1.4; }
.qa > summary::-webkit-details-marker { display: none; }
.qa > summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; }
.qa[open] > summary::after { content: "−"; }
.qa > summary:hover .qa-q { color: var(--accent); }
.qa > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.qa[open] > summary { border-bottom: 1px solid var(--line); }
.qa-lvl { flex: none; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.qa-jr { background: var(--ok-soft); color: var(--ok); }
.qa-mid { background: var(--accent-soft); color: var(--accent); }
.qa-sr { background: var(--prod-soft); color: var(--prod); }
.qa-sd, .qa-code { background: var(--warn-soft); color: var(--warn); }
.qa-sol { background: var(--accent-soft); color: var(--accent); }
.qa-explain { background: var(--ok-soft); color: var(--ok); }
.qa-debug { background: var(--warn-soft); color: var(--warn); }
.qa-defend { background: var(--prod-soft); color: var(--prod); }
.qa-built { background: var(--ok-soft); color: var(--ok); }
.qa-check { background: var(--prod-soft); color: var(--prod); }
.qa-a { padding: 4px 18px 8px; }
.qa-tools { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.qa-all { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer; }
.qa-all[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.qa-hint { color: var(--muted); font-size: 0.9rem; }
.quiz { margin: 2.6em 0 1em; padding-top: 18px; border-top: 1px solid var(--line); }
.quiz-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.quiz-head h2 { margin: 0 !important; font-size: var(--step-1) !important; }
.quiz-score { font-family: var(--font-display); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.q { margin: 18px 0; }
.q-text { font-weight: 600; max-width: 70ch; }
.q-num { font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); margin-right: 8px; }
.opts { display: grid; gap: 8px; max-width: 70ch; }
.opt { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: start; text-align: left; padding: 9px 12px;
  border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); color: var(--ink); cursor: pointer;
  font-family: var(--font-body); font-size: 0.95rem; line-height: 1.45; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt-key { font-family: var(--font-display); font-weight: 800; font-size: 0.78rem; color: var(--muted); padding-top: 2px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.q-explain { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); font-size: 0.93rem; max-width: 70ch; }

/* Tasks */
li.task { list-style: none; margin-left: -1.3em; display: flex; gap: 10px; align-items: baseline; }
li.task input { accent-color: var(--accent); transform: translateY(2px); }

/* Lesson header and footer */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--font-display); font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); text-decoration: none; font-weight: 600; }
.crumbs a:hover { color: var(--accent); }
.m-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { font-family: var(--font-display); font-size: 0.76rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip-num { background: var(--accent-soft); color: var(--accent); }
.chip-depth { background: var(--prod-soft); color: var(--prod); }
.chip-done { background: var(--ok-soft); color: var(--ok); }
.m-foot { margin-top: 3em; padding-top: 22px; border-top: 2px solid var(--ink); display: grid; gap: 18px; }
.done-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.done-btn, .cta { border: 0; border-radius: 9px; padding: 11px 18px; background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-display); font-weight: 700; font-size: 0.96rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.done-btn:hover, .cta:hover { filter: brightness(1.08); }
.done-btn.is-done { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }
.undo-btn, .ghost { border: 1px solid var(--line-strong); background: none; color: var(--muted); border-radius: 9px; padding: 9px 14px; font-family: var(--font-display); font-weight: 600; font-size: 0.86rem; cursor: pointer; text-decoration: none; }
.undo-btn:hover, .ghost:hover { border-color: var(--accent); color: var(--ink); }
.pn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pn { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; }
.pn:hover { border-color: var(--accent); }
.pn.next { text-align: right; }
.pn-dir { font-family: var(--font-display); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.pn-t { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; }

/* Lesson column with an on-this-page list beside it */
.lesson-wrap { display: grid; grid-template-columns: minmax(0, 900px); justify-content: center; gap: 44px; }
.onpage { display: none; }
@media (min-width: 1380px) {
  .lesson-wrap { grid-template-columns: minmax(0, 860px) 210px; }
  .onpage { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; max-height: calc(100vh - 120px); overflow-y: auto; font-family: var(--font-display); }
}
.onpage-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.onpage button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--muted); font: 500 0.82rem/1.35 var(--font-display); padding: 5px 0 5px 12px; border-left: 2px solid var(--line); cursor: pointer; }
.onpage button:hover { color: var(--ink); }
.onpage button.on { color: var(--accent); border-left-color: var(--accent); font-weight: 700; }

/* Home */
.view { max-width: 1080px; margin: 0 auto; }
.home-hero h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); margin: 6px 0 0; }
.home-hero .lede { font-size: 1.15rem; max-width: 62ch; color: var(--muted); margin: 12px 0 0; }
.dash { margin-top: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; }
.dash-ring { position: relative; width: 132px; height: 132px; }
.dash-ring .ring { width: 132px; height: 132px; }
.dash-ring .ring circle { stroke-width: 3.2; }
.dash-pct { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--font-display); }
.dash-pct b { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.dash-pct span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-top: 4px; }
.dash-body { min-width: 0; display: grid; gap: 12px; font-family: var(--font-display); }
.dash-line { font-size: 1.12rem; font-weight: 700; line-height: 1.3; }
.dash-line small { display: block; font-size: 0.88rem; color: var(--muted); font-weight: 500; margin-top: 3px; }
.dash-stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 0.86rem; color: var(--muted); }
.dash-stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dash-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sync { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.sync button { font: 600 0.8rem var(--font-display); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.sync .dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); display: inline-block; }
.sync.on .dotc { background: var(--ok); }

.home-h2 { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; font-family: var(--font-display); margin: 34px 0 10px; }
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.path-btn { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-family: var(--font-display); min-width: 0; }
.path-btn:hover { border-color: var(--accent); }
.path-btn b { display: block; font-size: 0.92rem; }
.path-btn span { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; line-height: 1.3; }
.path-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.path-note { font-family: var(--font-display); font-size: 0.86rem; color: var(--muted); margin: 10px 2px 0; max-width: 80ch; }

/* The route: one segment per chapter, as wide as its hours, filled as lessons are completed */
.route { display: flex; gap: 3px; margin-top: 6px; }
.route a { flex: 1 1 0; min-width: 6px; text-decoration: none; display: grid; gap: 5px; }
.route i { display: block; height: 12px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.route i > u { display: block; height: 100%; background: var(--accent); }
.route a.full i > u { background: var(--ok); }
.route a:hover i { outline: 2px solid var(--accent); outline-offset: 1px; }
.route span { font-family: var(--font-mono); font-size: 0.66rem; color: var(--muted); text-align: center; overflow: hidden; }
.route-legend { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 0.76rem; color: var(--muted); margin-top: 6px; }

.part { margin-top: 38px; }
.part-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.part-head h2 { font-size: 1.35rem; margin: 0; }
.part-head .eyebrow { margin-right: 2px; }
.part-head small { font-family: var(--font-display); font-size: 0.82rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.ch-card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; padding: 14px 16px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  text-decoration: none; color: var(--ink); min-width: 0; position: relative; overflow: hidden; }
.ch-card:hover { border-color: var(--accent); }
.ch-top { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 0.76rem; }
.ch-code { font-family: var(--font-mono); font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
.ch-state { margin-left: auto; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.ch-card.full .ch-state { color: var(--ok); }
.ch-card.started .ch-state { color: var(--accent); }
.ch-title { font-family: var(--font-display); font-weight: 700; font-size: 1.06rem; line-height: 1.25; }
.ch-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.45; }
.ch-foot { font-family: var(--font-display); font-size: 0.78rem; color: var(--muted); padding-bottom: 8px; font-variant-numeric: tabular-nums; }
.ch-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--surface-2); }
.ch-bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.ch-card.full .ch-bar > i { background: var(--ok); }
.home-foot { margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-family: var(--font-display); font-size: 0.82rem; color: var(--muted); }

/* Phase page */
.chv-head { border-bottom: 2px solid var(--ink); padding-bottom: 20px; }
.chv-head h1 { margin-top: 8px; }
.chv-head .lede { font-size: 1.1rem; color: var(--muted); max-width: 64ch; margin: 10px 0 0; }
.chv-prog { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-top: 18px; font-family: var(--font-display); font-size: 0.88rem; color: var(--muted); }
.chv-bar { flex: 1 1 180px; max-width: 320px; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.chv-bar > i { display: block; height: 100%; background: var(--accent); }
.chv-bar.full > i { background: var(--ok); }
.les-list { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 8px; }
.les-row { display: grid; grid-template-columns: 26px 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 13px 16px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); text-decoration: none; color: var(--ink); }
.les-row:hover { border-color: var(--accent); }
.les-row.off { opacity: 0.55; }
.les-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); position: relative; }
.les-row.done .les-check { background: var(--ok); border-color: var(--ok); }
.les-row.done .les-check::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2.2px 2.2px 0; transform: rotate(45deg); }
.les-row.here .les-check { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.les-num { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.les-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; line-height: 1.3; min-width: 0; }
.les-title small { display: block; font-weight: 500; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.les-meta { display: flex; gap: 8px; align-items: center; font-family: var(--font-display); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

.scrim { display: none; }
@media (max-width: 900px) {
  .menu-btn { display: inline-block; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 30; top: 0; left: 0; bottom: 0; height: auto; width: min(88vw, 340px); transform: translateX(-102%);
    transition: transform .22s ease; padding-top: calc(16px + env(safe-area-inset-top, 0px)); box-shadow: 0 0 40px #0004; }

.zx-bar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 12px; box-shadow: var(--shadow-2); }
.zx-bar .where { flex: 1; min-width: 0; text-align: center; font: 600 0.84rem var(--font-display); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zx-bar .where b { color: var(--ink); font-variant-numeric: tabular-nums; }
.zx-bar kbd { font: 600 0.7rem var(--font-mono); border: 1px solid var(--line-strong); border-radius: 5px; padding: 0 5px; margin-left: 6px; }
body[data-zx-mode="scroll"] .zx-bar { display: none; }
body[data-zx-mode="scroll"] .zx-stage + .zx-stage { margin-top: 4px; }

/* ---------- Briefing stage ---------- */
.zx-hero { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.zx .zx-hero h1 { margin: 0; font-size: clamp(1.8rem, 4.4vw, 2.7rem); font-weight: 800; line-height: 1.08; }

.zx-brief { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.zx-brief > .wide { grid-column: 1 / -1; }
.zx .zx-brief .co { margin: 0; height: 100%; }
.zx .co { border-left-width: 1px !important; border-radius: var(--r-lg); padding: 16px 18px 6px; }
.zx .co-why, .zx .co-plain, .zx .co-check, .zx .co-agentic, .zx .co-field, .zx .co-watch, .zx .co-visual, .zx .co-repos { border-color: transparent; }
.zx .co-plain { background: var(--surface-2); }
.zx .co-label { display: flex; align-items: center; gap: 7px; letter-spacing: 0.09em; }
.zx .co-label::before { content: none !important; }
.zx .co-goals ul { list-style: none; padding: 0; margin: 10px 0 12px; display: flex; flex-direction: column; gap: 8px; }
.zx .co-goals li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; margin: 0; max-width: none; }
.zx .co-goals .gk { width: 22px; height: 22px; margin-top: 2px; border-radius: 50%; display: grid; place-content: center; background: var(--accent); color: var(--accent-ink); animation: zx-pop .45s var(--spring) both; }
.zx .co-goals .gk .zx-ic { width: 13px; height: 13px; stroke-width: 2.8; }
.zx-pre { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 0.88rem; color: var(--muted); }
.zx-pre b { font: 700 0.72rem var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.zx-pre > .zx-ic { color: var(--ok); }
.zx-pre span { background: var(--surface-2); border-radius: 99px; padding: 2px 11px; }
.zx-terms { display: flex; flex-direction: column; gap: 12px; margin: 10px 0 14px; }
.zx-termchips { display: flex; flex-wrap: wrap; gap: 8px; }
.zx-termchips button { border: 1px solid color-mix(in srgb, var(--prod) 35%, transparent); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 5px 13px; font: 600 0.84rem var(--font-display); transition: transform .2s var(--spring), background .2s, color .2s; }
.zx-termchips button:hover { transform: translateY(-2px); }
.zx-termchips button[aria-pressed="true"] { background: var(--prod); color: var(--surface); border-color: var(--prod); }
.zx-termdef { background: var(--surface); border-radius: var(--r-md); padding: 14px 16px; min-height: 84px; }
.zx-termdef .m { font-size: 0.97rem; }
.zx-termdef b { display: block; font: 700 1.02rem var(--font-display); margin-bottom: 2px; }
.zx-termdef .w { display: block; font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
.zx-termdef a { color: var(--prod); font-weight: 600; }

/* ---------- Code labs ---------- */
.zx .zx-lab { margin: 1.2em 0; border-radius: var(--r-lg); overflow: hidden; background: var(--code-bg); box-shadow: var(--shadow-1); }
.zx-lab-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 14px; border-bottom: 1px solid #ffffff14; }
.zx-dots { display: inline-flex; gap: 6px; }
.zx-dots i { width: 10px; height: 10px; border-radius: 50%; background: #ffffff26; }
.zx-lab-name { flex: 1; min-width: 0; font: 600 0.74rem var(--font-mono); color: var(--code-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zx .zx-lab { position: relative; }
.zx .zx-lab > .code { position: static; }
.zx .zx-lab > .code > .copy { top: 7px; right: 10px; z-index: 4; transition: opacity .2s, transform .2s var(--spring); }
.zx .zx-lab .copy:active { transform: scale(.92); }
.zx .zx-lab .code { margin: 0; }
.zx .zx-lab .code pre { border-radius: 0; background: transparent; padding: 16px 18px; }
.zx-lab-run { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-top: 1px solid #ffffff14; }
.zx-runbtn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 9px; background: var(--c-str); color: #0c1a10; font: 700 0.84rem var(--font-display); padding: 7px 14px; transition: transform .18s var(--ease), filter .2s; }
.zx-runbtn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.zx-runbtn:active { transform: scale(.96); }
.zx-runbtn .zx-ic { fill: currentColor; stroke: none; width: .9em; height: .9em; }
.zx-lab-hint { font: 500 0.74rem var(--font-display); color: var(--code-muted); }
.zx-out { border-top: 1px solid #ffffff14; background: #00000040; }
.zx-out-label { display: flex; align-items: center; gap: 8px; padding: 9px 18px 0; font: 700 0.66rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-str); }
.zx-out-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c-str); }
.zx .zx-out .code { margin: 0; }
.zx .zx-out .code pre { background: transparent; border-radius: 0; padding: 8px 18px 16px; font-size: 0.8rem; }
.zx-out { position: relative; }
.zx .zx-out .code { position: static; }
.zx .zx-out .copy { top: 5px; right: 10px; }
.zx-notice { background: var(--ok-soft); color: var(--ink); padding: 14px 18px 4px; animation: zx-rise .5s var(--ease-out) both; font-size: 0.95rem; }
.zx-notice .co-label { color: var(--ok); margin-bottom: 4px; }
.zx-notice p, .zx-notice li { max-width: 70ch; }

/* ---------- Figures ---------- */
.zx .dg-scroll, .zx .xfig-frame { border-radius: var(--r-lg); }
.zx-figbar { display: flex; justify-content: flex-end; margin-bottom: -6px; }
.zx-mini { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 3px 11px; font: 600 0.74rem var(--font-display); transition: color .2s, transform .2s var(--spring); }
.zx-mini:hover { color: var(--accent); transform: translateY(-1px); }
.zx-mini .zx-ic { width: 13px; height: 13px; }
.zx .dg > * { transform-box: fill-box; transform-origin: center; }
.zx .xfig-frame { position: relative; cursor: zoom-in; transition: box-shadow .3s, transform .3s var(--ease-out); }
.zx .xfig-frame:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.zx-light { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: color-mix(in srgb, #0b0d10 86%, transparent); cursor: zoom-out; animation: zx-fade .25s both; }
@keyframes zx-fade { from { opacity: 0; } to { opacity: 1; } }
.zx-light figure { margin: 0; max-width: min(1200px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; animation: zx-pop .35s var(--ease-out) both; }
.zx-light img { max-width: 100%; max-height: 80vh; object-fit: contain; background: #fff; border-radius: 12px; padding: 12px; }
.zx-light figcaption { color: #e7eaee; font-size: 0.86rem; max-width: 90ch; }

/* ---------- Myth cards ---------- */
.zx-myths { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 12px 0 14px; }
.zx-myth { display: flex; flex-direction: column; text-align: left; background: var(--surface); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius: var(--r-md); padding: 14px; gap: 8px; transition: transform .25s var(--ease-out), box-shadow .25s; }
.zx-myth:hover { transform: translateY(-3px); box-shadow: var(--shadow-1); }
.zx-myth .tag { align-self: flex-start; font: 800 0.66rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 2px 9px; border-radius: 99px; transition: background .3s, color .3s; }
.zx-myth .claim { font: 600 0.98rem/1.4 var(--font-display); transition: color .3s; }
.zx-myth .hint { font: 600 0.76rem var(--font-display); color: var(--muted); }
.zx-myth .truth { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease-out); }
.zx-myth .truth > span { display: block; overflow: hidden; font-size: 0.92rem; }
.zx-myth.open .truth { grid-template-rows: 1fr; }
.zx-myth.open .claim { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); }
.zx-myth.open .tag { background: var(--bad-soft); color: var(--bad); }
.zx-myth.open .hint { display: none; }
.zx-myth .truth b { color: var(--ok); font-family: var(--font-display); }

/* ---------- Practice ---------- */
.zx-ex { align-items: start; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.zx-excard { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; background: var(--surface); transition: box-shadow .25s, transform .25s var(--ease-out); min-width: 0; }
.zx-excard:hover { box-shadow: var(--shadow-1); transform: translateY(-2px); }
.zx-excard .lvl { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font: 800 0.68rem var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 3px 10px; }
.zx-excard[data-k="broken"] .lvl, .zx-excard[data-k="debugx"] .lvl { color: var(--warn); background: var(--warn-soft); }
.zx-excard .xq > :first-child { margin-top: 0; } .zx-excard .xq > :last-child { margin-bottom: 0; }
.zx-excard .xq { font-size: 0.96rem; }
.zx-sol { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease-out); }
.zx-sol > div { overflow: hidden; min-width: 0; }
.zx-sol.open { grid-template-rows: 1fr; }
.zx-sol .in { border-top: 1px dashed var(--line-strong); margin-top: 4px; padding-top: 10px; font-size: 0.94rem; }
.zx-sol .in b.h { display: block; font: 700 0.9rem var(--font-display); color: var(--ok); margin-bottom: 2px; }
.zx-excard .zx-mini { align-self: flex-start; margin-top: auto; }

/* ---------- Check ---------- */
.zx .qa { border-radius: var(--r-md); transition: box-shadow .25s, border-color .25s; }
.zx .qa:hover { border-color: var(--line-strong); box-shadow: var(--shadow-1); }
.zx .qa[open] > .qa-a { animation: zx-rise .4s var(--ease-out) both; }
.zx .quiz { border-radius: var(--r-lg); }
.zx .opt { transition: transform .18s var(--ease), background .25s, border-color .25s; }
.zx .opt:hover:not([disabled]) { transform: translateX(4px); }
.zx .opt.right { animation: zx-pop .35s var(--spring); border-color: var(--ok); background: var(--ok-soft); }
.zx .opt.wrong { animation: zx-shake .4s; border-color: var(--bad); background: var(--bad-soft); }
.zx .q-explain { animation: zx-rise .4s var(--ease-out) both; }

/* ---------- Done ---------- */
.zx-done { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 12px; }
.zx-seal { width: 96px; height: 96px; }
.zx-seal circle { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 3; stroke-dasharray: 290; stroke-dashoffset: 290; }
.zx-seal path { fill: none; stroke: var(--ok); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 70; stroke-dashoffset: 70; }
.zx-done.play .zx-seal circle { animation: zx-draw .7s var(--ease-out) forwards; }
.zx-done.play .zx-seal path { animation: zx-draw .45s .55s var(--ease-out) forwards; }
@keyframes zx-draw { to { stroke-dashoffset: 0; } }
.zx-done h2 { margin: 0; font-size: 2rem; font-weight: 800; }
.zx-done p { margin: 0; color: var(--muted); max-width: 52ch; }
.zx-recap { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 8px; text-align: left; max-width: 620px; }
.zx-recap li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; background: var(--surface-2); border-radius: var(--r-md); padding: 10px 14px; font-size: 0.95rem; }
.zx-recap li svg { color: var(--ok); margin-top: 3px; }
.zx-done.play .zx-recap li { animation: zx-rise .5s var(--ease-out) both; }
.zx-next { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
.zx-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

/* ---------- Popover, toast ---------- */
.zx-pop { position: absolute; z-index: 40; max-width: 320px; background: var(--ink); color: var(--bg); border-radius: var(--r-md); padding: 12px 14px; font-size: 0.86rem; line-height: 1.45; box-shadow: var(--shadow-2); animation: zx-pop .22s var(--ease-out) both; transform-origin: top left; }
.zx-pop b { display: block; font-family: var(--font-display); margin-bottom: 2px; }
.zx-pop span { display: block; margin-top: 6px; opacity: .75; font-size: 0.78rem; }
.zx-toast { position: fixed; z-index: 80; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font: 600 0.86rem var(--font-display); padding: 10px 16px; border-radius: 99px; box-shadow: var(--shadow-2); animation: zx-rise .3s var(--ease-out) both; max-width: calc(100% - 32px); text-align: center; }
mark.term.flash { animation: zx-pulse 1.2s 2; }

/* ---------- Narrow screens ---------- */
@media (max-width: 940px) {
  .zx-lesson { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .zx-rail { position: static; max-height: none; overflow: visible; }
  .zx-steps { display: none; }
  .zx-rail-title { font-size: 1.05rem; }
}
@media (max-width: 640px) {
  .zx-cont { grid-template-columns: minmax(0, 1fr); padding: 20px; gap: 16px; }
  .zx-bigring { width: 104px; height: 104px; }
  .zx-brief { grid-template-columns: minmax(0, 1fr); }
  .zx-part { grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; }
  .zx-node { width: 26px; height: 26px; font-size: .66rem; }
  .zx-bar kbd { display: none; }
  .zx-bar .zx-btn { padding: 10px 14px; }
  .zx-view { padding-block: 18px 70px; }
}
@media (prefers-reduced-motion: reduce) {
  .zx *, .zx *::before, .zx *::after, .zx-light, .zx-light * { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

/* ---------- Visual blocks inside a lesson ---------- */
.zx .prose > p.zx-lead { font-size: 1.2rem; line-height: 1.5; font-weight: 500; max-width: 60ch; color: var(--ink); }
.zx-vlabel { display: flex; align-items: center; gap: 8px; font: 700 0.72rem var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 1.9em 0 .7em; }
.zx-vlabel::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Timeline */
.zx-tl { list-style: none; padding: 0; margin: 1.4em 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 18px; position: relative; }
.zx-tl::before { content: ""; position: absolute; left: 9px; right: 9px; top: 8px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--prod)); transform-origin: left; animation: zx-growx 1.1s var(--ease-out) both; }
@keyframes zx-growx { from { transform: scaleX(0); } to { transform: none; } }
@keyframes zx-growy { from { transform: scaleY(0); } to { transform: none; } }
.zx .prose .zx-tl li { margin: 0; max-width: none; position: relative; padding-top: 30px; display: flex; flex-direction: column; gap: 2px; animation: zx-rise .55s var(--ease-out) both; }
.zx-tl li::before { content: ""; position: absolute; top: 0; left: 0; width: 19px; height: 19px; border-radius: 50%; background: var(--surface); border: 4px solid var(--accent); box-sizing: border-box; animation: zx-pop .45s var(--spring) both; animation-delay: inherit; }
.zx-tl li:nth-child(2)::before { border-color: color-mix(in srgb, var(--accent) 50%, var(--prod)); }
.zx-tl li:nth-child(3)::before { border-color: var(--prod); }
.zx-tl .when { font: 700 0.78rem var(--font-mono); color: var(--accent); }
.zx-tl b { font: 700 1.05rem/1.25 var(--font-display); }
.zx-tl .what { font-size: 0.9rem; color: var(--muted); line-height: 1.45; }

/* Table rows as cards */
.zx-tc { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 1em 0 1.4em; }
.zx-tcard { background: var(--surface-2); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; animation: zx-rise .5s var(--ease-out) both; transition: transform .25s var(--ease-out), box-shadow .25s; }
.zx-tcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-1); }
.zx-tcard-h { display: flex; align-items: center; gap: 10px; }
.zx-mono { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-content: center; font: 800 1rem var(--font-display); background: var(--accent); color: var(--accent-ink); }
.zx-tcard:nth-child(3n+2) .zx-mono { background: var(--prod); color: var(--surface); }
.zx-tcard:nth-child(3n+3) .zx-mono { background: var(--ag); color: var(--surface); }
.zx-tcard h4 { margin: 0; font: 700 1.1rem var(--font-display); }
.zx-tcard dl { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.zx-tcard dt { font: 700 0.66rem var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.zx-tcard dd { margin: 1px 0 0; font-size: 0.92rem; line-height: 1.45; overflow-wrap: anywhere; }
.zx .prose .zx-tcard dd.cb > code { display: block; background: var(--code-bg); color: var(--code-ink); padding: 8px 10px; border-radius: 8px; font-size: 0.74rem; line-height: 1.5; }

/* Two options side by side */
.zx-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: .6em 0 .4em; }
.zx-duo > div { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; animation: zx-rise .5s var(--ease-out) both; }
.zx-duo > div + div { animation-delay: .12s; }
.zx-duo svg { width: 100%; height: auto; max-height: 96px; margin-bottom: 6px; }
.zx-duo .bx { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1.4; }
.zx-duo .zone { fill: none; stroke: var(--line-strong); stroke-dasharray: 5 5; stroke-width: 1.2; }
.zx-duo text { font: 600 11px var(--font-display); fill: var(--ink); text-anchor: middle; }
.zx-duo text.s { fill: var(--muted); font-weight: 500; font-size: 9.5px; }
.zx-duo .flow { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 6; animation: zx-flow 1.1s linear infinite; }
.zx-duo .flow.p { stroke: var(--prod); }
@keyframes zx-flow { to { stroke-dashoffset: -24; } }
.zx-duo .tagline { font: 700 0.68rem var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.zx-duo > div + div .tagline { color: var(--prod); }
.zx-duo b { font: 700 1.08rem var(--font-display); }
.zx-duo span.d { font-size: 0.9rem; color: var(--muted); line-height: 1.45; }
.zx-fine { font-size: 0.84rem; color: var(--muted); margin: .2em 0 1em; }

/* Status cards */
.zx-status { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: .6em 0; }
.zx-status > div { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; animation: zx-rise .5s var(--ease-out) both; }
.zx-status .pill { align-self: flex-start; font: 800 0.64rem var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; border-radius: 99px; padding: 2px 9px; background: var(--ok-soft); color: var(--ok); }
.zx-status .old .pill { background: var(--surface-2); color: var(--muted); }
.zx-status .old b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.zx-status b { font: 700 1rem var(--font-display); }
.zx-status span.d { font-size: 0.88rem; color: var(--muted); line-height: 1.4; }

/* Takeaway */
