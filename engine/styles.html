<style id="dj-css">
/* Dojo layer: warm paper frame, white rounded cards, dark pill buttons, an icon rail, a command search,
   and new pages (Interview, Playground, Review). It only restyles and adds; lesson content is untouched. */
:root {
  --bg: #f3eee5; --surface: #ffffff; --surface-2: #f4efe7; --ink: #211c16; --muted: #6c6357;
  --line: #ebe4d8; --line-strong: #d8cdbc;
  --accent: #b5521b; --accent-ink: #ffffff; --accent-soft: #f9e8da;
  --dj-pill: #211c16; --dj-pill-ink: #fbf8f2; --dj-soft: #efe8dc; --dj-frame: #faf7f2;
  --dj-ok: #2f7d55; --dj-mid: #b07c12; --dj-hard: #c2492f;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --dj-r: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13110e; --surface: #1d1a16; --surface-2: #26221c; --ink: #efe8dc; --muted: #a99f90;
  --line: #2e2923; --line-strong: #463e34; --accent: #f0915f; --accent-ink: #2a1206; --accent-soft: #3a2418;
  --dj-pill: #efe8dc; --dj-pill-ink: #1b1712; --dj-soft: #2a251f; --dj-frame: #0f0d0b;
  --dj-ok: #6fcf98; --dj-mid: #e2b552; --dj-hard: #f08a72; } }
:root[data-theme="dark"] {
  --bg: #13110e; --surface: #1d1a16; --surface-2: #26221c; --ink: #efe8dc; --muted: #a99f90;
  --line: #2e2923; --line-strong: #463e34; --accent: #f0915f; --accent-ink: #2a1206; --accent-soft: #3a2418;
  --dj-pill: #efe8dc; --dj-pill-ink: #1b1712; --dj-soft: #2a251f; --dj-frame: #0f0d0b;
  --dj-ok: #6fcf98; --dj-mid: #e2b552; --dj-hard: #f08a72; color-scheme: dark; }

html { background: var(--bg); }
body.dj { background: var(--bg); font-size: 1rem; line-height: 1.7; }
body.dj .prose { font-size: 1.02rem; }

/* ---------- icon rail ---------- */
.dj-rail { position: fixed; z-index: 25; left: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px); width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dj-logo { white-space: nowrap; font-size: .9rem !important; width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 1px; border-radius: 16px; color: var(--ink); text-decoration: none; font: 800 1rem var(--font-display); letter-spacing: -.02em; }
.dj-logo span { color: var(--accent); }
.dj-icons { background: var(--surface); border-radius: var(--dj-r); padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 0 var(--line); border: 1px solid var(--line); }
.dj-ic { position: relative; width: 46px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: var(--muted); text-decoration: none; border: 0; background: none; cursor: pointer; }
.dj-ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dj-ic:hover { color: var(--ink); background: var(--surface-2); }
.dj-ic.on { background: var(--dj-pill); color: var(--dj-pill-ink); }
.dj-ic .dj-tip { position: absolute; left: 56px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--dj-pill); color: var(--dj-pill-ink); font: 600 .78rem var(--font-display); padding: 5px 10px; border-radius: 9px; opacity: 0; pointer-events: none; transition: opacity .12s; }
.dj-ic:hover .dj-tip, .dj-ic:focus-visible .dj-tip { opacity: 1; }
.dj-icons .dj-theme2 { display: none; }
.dj-ic .dj-badge { position: absolute; top: 3px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 700 .62rem/16px var(--font-display); }

/* ---------- top bar ---------- */
body.dj .topbar { background: var(--bg); border-bottom: 0; margin-left: 92px; padding-top: 12px; padding-bottom: 10px; gap: 12px; }
body.dj .brand { display: none; }
body.dj .menu-btn { border-radius: 99px; }
.dj-search { flex: 0 1 380px; min-width: 0; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px 0 16px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; cursor: pointer; font: 500 .92rem var(--font-display); text-align: left; }
.dj-search:hover { border-color: var(--line-strong); color: var(--ink); }
.dj-search svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; }
.dj-search span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dj-search kbd, .dj-k kbd { font: 600 .68rem var(--font-mono); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; color: var(--muted); background: var(--surface-2); }
body.dj .tb-where { order: 3; }
.dj-theme { flex: none; width: 42px; height: 42px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.dj-theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
body.dj .tb-progress, body.dj .zx-mode { border-radius: 99px; background: var(--surface); border-color: var(--line); }

/* ---------- shell ---------- */
body.dj .shell { margin-left: 92px; margin-right: 14px; }
body.dj .rail { background: var(--surface); border-radius: var(--dj-r); border: 1px solid var(--line); margin: 0 14px 14px 0; height: calc(100vh - 86px); top: 72px; }
body.dj.dj-wide .shell { grid-template-columns: minmax(0, 1fr); }
body.dj.dj-wide .rail { display: none; }
body.dj main { padding-top: 4px; }
body.dj .view { max-width: 1240px; }

/* ---------- cards & buttons ---------- */
.dj-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--dj-r); padding: 24px 26px; min-width: 0; }
.dj-card + .dj-card { margin-top: 16px; }
.dj-eyebrow { font: 600 .82rem var(--font-display); color: var(--accent); }
.dj-h { font: 700 1.08rem/1.3 var(--font-display); margin: 0; }
.dj-sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
.dj-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 99px; padding: 11px 20px; font: 600 .92rem var(--font-display); cursor: pointer; text-decoration: none; background: var(--dj-soft); color: var(--ink); }
.dj-btn:hover { filter: brightness(.97); }
.dj-btn.dark { background: var(--dj-pill); color: var(--dj-pill-ink); }
.dj-btn.ghost { background: var(--surface); border: 1px solid var(--line-strong); }
.dj-btn.block { width: 100%; }
.dj-btn[disabled] { opacity: .45; cursor: default; }
.dj-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.dj-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dj-dot.t0 { background: var(--dj-ok); } .dj-dot.t1 { background: var(--dj-mid); } .dj-dot.t2 { background: var(--dj-hard); } .dj-dot.t3 { background: var(--prod); } .dj-dot.t4 { background: var(--ag); } .dj-dot.t5 { background: var(--accent); } .dj-dot.t6 { background: var(--ok); } .dj-dot.t7 { background: var(--warn); } .dj-dot.t8 { background: var(--muted); } .dj-dot.t9 { background: var(--bad); }
.dj-dot.l1 { background: var(--dj-ok); } .dj-dot.l2 { background: var(--dj-mid); } .dj-dot.l3 { background: var(--dj-hard); } .dj-dot.l0 { background: var(--line-strong); }

/* thumbnails made from the lesson's own diagrams */
.dj-thumb { background: var(--surface-2); border-radius: 16px; padding: 10px; height: 150px; display: grid; place-items: center; overflow: hidden; pointer-events: none; }
.dj-thumb figure.diagram { margin: 0; width: 100%; height: 100%; }
.dj-thumb .dg-scroll { overflow: hidden; height: 100%; }
.dj-thumb svg { width: 100% !important; height: 100% !important; max-height: 100%; min-width: 0 !important; }
.dj-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.dj-thumb.sm { height: 92px; border-radius: 12px; padding: 6px; }
.dj-thumb.empty { font: 800 2.2rem var(--font-mono); color: var(--line-strong); }

/* ---------- home ---------- */
.dj-home { display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-areas: "hero side" "rest side"; gap: 18px; align-items: start; }
.dj-hero { grid-area: hero; }
.dj-side { grid-area: side; position: sticky; top: 72px; display: grid; gap: 16px; }
.dj-side .dj-card + .dj-card { margin-top: 0; }
.dj-rest { grid-area: rest; min-width: 0; }
.dj-hero .home-hero h1 { font-size: clamp(2rem, 4.2vw, 3rem); letter-spacing: -.02em; }
.dj-hero .home-hero .lede { font-size: 1.04rem; }
.dj-hero .dj-btns { margin-top: 18px; }
.dj-start { margin-top: 22px; background: var(--surface-2); border-radius: 18px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 20px; align-items: center; }
.dj-start .dj-thumb { background: var(--surface); height: 170px; }
.dj-start h3 { font: 700 1.3rem/1.25 var(--font-display); margin: 4px 0 4px; }
.dj-segs { display: flex; gap: 4px; margin: 14px 0 6px; }
.dj-segs i { flex: 1; height: 5px; border-radius: 9px; background: var(--line-strong); opacity: .55; }
.dj-segs i.on { background: var(--accent); opacity: 1; }
.dj-meta { font: 500 .8rem var(--font-mono); color: var(--muted); }
.dj-start .dj-btns { margin-top: 14px; }
.dj-rest > .dash, .dj-rest > .dj-card { margin-top: 0; margin-bottom: 16px; }
body.dj .dash { border-radius: var(--dj-r); border-color: var(--line); padding: 22px 24px; }
body.dj .home-h2 { margin-top: 0; }
body.dj .path-btn { border-radius: 16px; padding: 12px 14px; }
body.dj .part { background: var(--surface); border: 1px solid var(--line); border-radius: var(--dj-r); padding: 22px 24px 24px; margin: 0 0 16px; }
body.dj .part-node { display: none; }
body.dj .part-head { border-bottom: 0; padding-bottom: 0; }
body.dj .ch-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
body.dj .ch-card { background: var(--surface-2); border: 0; border-radius: 18px; padding: 10px 10px 14px; grid-template-rows: auto auto auto 1fr auto; overflow: hidden; }
body.dj .ch-card:hover { box-shadow: 0 0 0 2px var(--accent) inset; }
body.dj .ch-card > *:not(.dj-thumb):not(.ch-bar) { padding: 0 6px; }
body.dj .ch-card .dj-thumb { background: var(--surface); margin-bottom: 4px; height: 128px; }
body.dj .ch-desc { font-size: .84rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
body.dj .ch-bar { left: 16px; right: 16px; bottom: 10px; height: 4px; border-radius: 9px; }
body.dj .route i { height: 10px; border-radius: 99px; }
.dj-mini-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); font: 600 .9rem var(--font-display); }
.dj-mini-row small { color: var(--muted); font-weight: 500; white-space: nowrap; }
.dj-big { font: 800 2.6rem/1 var(--font-display); letter-spacing: -.02em; }
.dj-big + span { color: var(--muted); font-size: .92rem; margin-left: 6px; }
.dj-lvlbar { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font: 500 .84rem var(--font-display); margin-top: 12px; }
.dj-lvlbar u { grid-column: 1 / -1; height: 4px; border-radius: 9px; background: var(--surface-2); display: block; text-decoration: none; overflow: hidden; }
.dj-lvlbar u i { display: block; height: 100%; }
.dj-pg-art { width: 58px; height: 58px; border-radius: 14px; background: var(--surface-2); flex: none; display: grid; place-items: center; }

/* ---------- chapter page ---------- */
body.dj .chv-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--dj-r); padding: 26px 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 24px; align-items: center; }
body.dj .chv-head > :not(.dj-thumb) { grid-column: 1; }
body.dj .chv-head > .dj-thumb { grid-column: 2; grid-row: 1 / span 6; height: 210px; }
body.dj .les-list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
body.dj .les-row { grid-template-columns: 24px 44px minmax(0, 1fr); grid-template-rows: auto auto auto; border-radius: 20px; padding: 10px 12px 14px; align-items: start; height: 100%; }
body.dj .les-row .dj-thumb { grid-column: 1 / -1; margin-bottom: 6px; }
body.dj .les-row .les-meta { grid-column: 1 / -1; flex-wrap: wrap; white-space: normal; }
body.dj .les-check { margin-top: 2px; }

/* ---------- lesson ---------- */
body.dj .zx-stage, body.dj .m-head { border-radius: var(--dj-r); }
body.dj .zx-bar { border-radius: 99px; }
body.dj .q { border-radius: 16px; }
body.dj .opt { border-radius: 12px; background: var(--surface); }
body.dj .opt-key { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; padding: 0; font-size: .7rem; }
body.dj .quiz-head h2::before { content: "Quick check · "; color: var(--accent); font: 600 .8em var(--font-mono); }
body.dj aside.co-run .co-label::after { content: " · recorded from a real run"; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
.dj-pred { margin-top: 12px; display: grid; gap: 10px; }
.dj-pred textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 12px; font: 500 .92rem/1.5 var(--font-body); background: var(--surface); color: var(--ink); }
.dj-pred .dj-btns { align-items: center; }
.dj-pred .dj-skip { border: 0; background: none; color: var(--muted); font: 500 .84rem var(--font-display); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.dj-pred-locked { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: .92rem; }
.dj-pred-locked b { display: block; font: 700 .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 2px; }
.zx-excard[data-k="predict"].dj-wait .zx-solbtn { display: none; }
.dj-tag { display: inline-flex; align-items: center; gap: 6px; font: 600 .72rem var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }

/* ---------- command search ---------- */
.dj-k { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--ink) 30%, transparent); display: grid; justify-items: center; align-items: start; padding: 10vh 16px 16px; }
.dj-k[hidden] { display: none; }
.dj-kbox { width: min(680px, 100%); background: var(--surface); border-radius: 22px; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.22); overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; }
.dj-kin { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dj-kin svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; flex: none; }
.dj-kin input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 500 1.05rem var(--font-display); color: var(--ink); }
.dj-klist { overflow-y: auto; padding: 8px; }
.dj-kgroup { font: 700 .7rem var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
.dj-kit { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 9px 10px; border-radius: 12px; text-decoration: none; color: var(--ink); font-family: var(--font-display); }
.dj-kit small { font: 500 .74rem var(--font-mono); color: var(--muted); padding-top: 2px; }
.dj-kit span { font-size: .92rem; line-height: 1.35; }
.dj-kit em { display: block; font-style: normal; color: var(--muted); font-size: .8rem; }
.dj-kit.sel, .dj-kit:hover { background: var(--surface-2); }
.dj-kfoot { display: flex; gap: 14px; padding: 10px 18px; border-top: 1px solid var(--line); font: 500 .76rem var(--font-display); color: var(--muted); }
.dj-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 10px 10px; }
.dj-chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 6px 12px; font: 500 .84rem var(--font-display); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.dj-chip.on { background: var(--dj-pill); color: var(--dj-pill-ink); border-color: var(--dj-pill); }
.dj-chip b { font-weight: 600; opacity: .7; }

/* ---------- pages ---------- */
.dj-page-h { font: 800 clamp(1.8rem, 3.6vw, 2.4rem)/1.1 var(--font-display); letter-spacing: -.02em; margin: 6px 0 6px; }
.dj-3col { display: grid; grid-template-columns: 230px minmax(0, 1fr) 260px; gap: 22px; align-items: start; }
.dj-toc { position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow-y: auto; font-family: var(--font-display); padding-right: 4px; }
.dj-toc h4 { font: 700 .68rem var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 8px 6px; }
.dj-toc button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 6px 10px; border-radius: 10px; font: 500 .86rem/1.3 var(--font-display); cursor: pointer; }
.dj-toc button small { color: var(--muted); font-variant-numeric: tabular-nums; }
.dj-toc button.on { background: var(--dj-soft); font-weight: 700; }
.dj-input { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 99px; padding: 0 18px; background: var(--surface); color: var(--ink); font: 500 .95rem var(--font-display); }
.dj-qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; margin-top: 12px; }
.dj-qcard > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 40px minmax(0, 1fr) 30px; gap: 8px; padding: 16px 18px; }
.dj-qcard > summary::-webkit-details-marker { display: none; }
.dj-qn { font: 600 .82rem var(--font-mono); color: var(--muted); padding-top: 3px; }
.dj-qmeta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 500 .76rem var(--font-display); color: var(--muted); margin-bottom: 4px; }
.dj-qt { font: 500 .98rem/1.5 var(--font-display); }
.dj-chev { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; transition: transform .15s; }
.dj-chev svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.dj-qcard[open] .dj-chev { transform: rotate(180deg); }
.dj-qbody { padding: 0 22px 18px 66px; }
.dj-qbody .dj-say { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font: 500 .86rem var(--font-display); color: var(--muted); margin-bottom: 12px; }
.dj-qbody .prose-like > :first-child { margin-top: 0; }
.dj-group-h { display: flex; gap: 14px; align-items: center; margin-top: 26px; }
.dj-group-h .dj-thumb { width: 96px; height: 64px; padding: 4px; border-radius: 12px; flex: none; }
.dj-statcard .dj-big { display: block; margin-top: 8px; }
.dj-empty { color: var(--muted); text-align: center; padding: 30px 10px; }

/* review */
.dj-rq { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; margin-top: 14px; }
.dj-rq .q-text { font: 600 1.02rem/1.5 var(--font-display); margin: 6px 0 12px; }
.dj-rq .dj-opts { display: grid; gap: 8px; }
.dj-opt { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; cursor: pointer; font: 500 .94rem/1.45 var(--font-body); }
.dj-opt i { font: 700 .7rem/22px var(--font-display); font-style: normal; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); text-align: center; }
.dj-opt.pick { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
.dj-opt.right { border-color: var(--ok); background: var(--ok-soft); }
.dj-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.dj-explain { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: .94rem; }
.dj-boxes { display: flex; gap: 6px; margin-top: 8px; }
.dj-boxes span { flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px; background: var(--surface-2); font: 600 .78rem var(--font-display); color: var(--muted); }
.dj-boxes span b { display: block; font-size: 1.3rem; color: var(--ink); }

/* playground */
.dj-lab { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.dj-canvas-wrap { background: var(--surface-2); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.dj-canvas-wrap canvas { width: 100%; max-width: 560px; margin: 0 auto; height: auto; border-radius: 12px; display: block; image-rendering: auto; }
.dj-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 500 .82rem var(--font-mono); color: var(--muted); }
.dj-stats b { color: var(--ink); }
.dj-ctl { display: grid; gap: 14px; }
.dj-ctl label { display: grid; gap: 4px; font: 600 .84rem var(--font-display); }
.dj-ctl label span { display: flex; justify-content: space-between; }
.dj-ctl label span em { font: 500 .8rem var(--font-mono); font-style: normal; color: var(--muted); }
.dj-ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.dj-try { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.dj-try button { text-align: left; background: var(--surface-2); border: 1px solid transparent; border-radius: 16px; padding: 14px 16px; cursor: pointer; color: var(--ink); font: 500 .88rem/1.45 var(--font-display); }
.dj-try button:hover { border-color: var(--accent); }
.dj-try button b { display: block; font-size: .95rem; margin-bottom: 4px; }
.dj-labgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.dj-labcard { background: var(--surface-2); border-radius: 18px; padding: 10px 10px 14px; border: 0; text-align: left; cursor: pointer; color: var(--ink); font-family: var(--font-display); display: grid; gap: 6px; }
.dj-labcard:hover, .dj-labcard.on { box-shadow: 0 0 0 2px var(--accent) inset; }
.dj-labcard .dj-thumb { background: var(--surface); height: 120px; }
.dj-labcard b { padding: 0 6px; font-size: .95rem; line-height: 1.3; }
.dj-labcard small { padding: 0 6px; color: var(--muted); font-size: .78rem; }
.dj-stage figure.viz { margin: 0; border: 0; padding: 0; }

/* ---------- phones and tablets ---------- */
@media (max-width: 1180px) {
  .dj-home { grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "side" "rest"; }
  .dj-side { position: static; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .dj-3col { grid-template-columns: 200px minmax(0, 1fr); }
  .dj-3col > .dj-right { grid-column: 1 / -1; grid-row: 1; }
}
@media (max-width: 900px) {
  .dj-rail { left: 0; right: 0; top: auto; bottom: 0; width: auto; flex-direction: row; padding: 0 10px calc(env(safe-area-inset-bottom, 0px) + 8px); background: linear-gradient(transparent, var(--bg) 30%); }
  .dj-logo { display: none; }
  .dj-icons { flex-direction: row; justify-content: space-around; width: 100%; padding: 6px; }
  .dj-ic { flex: 1; width: auto; }
  .dj-ic .dj-tip { display: none; }
  body.dj .topbar { margin-left: 0; padding-left: 16px; padding-right: 16px; }
  body.dj .shell { margin-left: 0; margin-right: 0; }
  body.dj .rail { margin: 0; border-radius: 0 var(--dj-r) var(--dj-r) 0; height: auto; top: 0; }
  body.dj main { padding-bottom: 86px; }
  body.dj .zx-bar { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .dj-search { flex: 1 1 auto; }
  .dj-search kbd { display: none; }
  .dj-start { grid-template-columns: minmax(0, 1fr); }
  body.dj .chv-head { grid-template-columns: minmax(0, 1fr); }
  body.dj .chv-head > .dj-thumb { grid-column: 1; grid-row: auto; height: 170px; }
  .dj-3col { grid-template-columns: minmax(0, 1fr); }
  .dj-toc { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .dj-toc h4 { display: none; }
  .dj-toc button { width: auto; white-space: nowrap; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; }
  .dj-lab { grid-template-columns: minmax(0, 1fr); }
  .dj-3col > .dj-right { grid-row: auto; order: 3; }
  .dj-3col > .dj-right .dj-card { position: static !important; }
  .dj-qbody { padding: 0 18px 16px; }
}
@media (max-width: 640px) {
  .dj-card { padding: 18px 16px; }
  body.dj .tb-progress small, body.dj #tb-pct, body.dj .topbar .dj-theme { display: none; }
  body.dj .tb-progress { padding: 4px; }
  .dj-icons .dj-theme2 { display: grid !important; }
  .dj-search { flex: 0 0 42px; width: 42px; padding: 0; justify-content: center; }
  .dj-search span { display: none; }
  body.dj .topbar { gap: 8px; }
  .dj-qcard > summary { grid-template-columns: 30px minmax(0, 1fr) 28px; padding: 14px; }
  body.dj .part { padding: 16px 14px; }
}

/* ---------- moving diagrams ---------- */
.mo-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; margin: 0 0 6px; font: 600 .76rem var(--font-display); }
.mo-bar button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 4px 11px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 5px; }
.mo-bar button:hover { color: var(--ink); border-color: var(--line-strong); }
.mo-bar button[aria-pressed="true"] { background: var(--dj-pill); color: var(--dj-pill-ink); border-color: var(--dj-pill); }
.mo-bar button[disabled] { opacity: .4; cursor: default; }
.mo-bar svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.mo-nav { display: inline-flex; align-items: center; gap: 6px; }
.mo-nav .mo-prev, .mo-nav .mo-next { width: 28px; height: 28px; padding: 0; justify-content: center; font-size: 1rem; }
.mo-count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
.mo-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; pointer-events: none; }
svg .mo-dim { opacity: .2; transition: opacity .2s; }
svg .mo-on { opacity: 1; }
figure.mo-stepping .dg-scroll { box-shadow: 0 0 0 2px var(--accent-soft) inset; border-radius: 12px; }
svg * { transform-box: fill-box; }

/* isometric plates */
.iso-plate .iso polygon { stroke-width: 1; stroke-linejoin: round; }
.iso-b .ft, .iso-slab .ft { fill: var(--surface-2); stroke: var(--line-strong); }
.iso-b .fl, .iso-slab .fl { fill: color-mix(in srgb, var(--surface-2) 70%, var(--ink) 12%); stroke: var(--line-strong); }
.iso-b .fr, .iso-slab .fr { fill: color-mix(in srgb, var(--surface-2) 80%, var(--ink) 6%); stroke: var(--line-strong); }
.iso-slab .ft { fill: var(--surface); }
.iso-p .ft { fill: var(--prod-soft); stroke: var(--prod); } .iso-p .fl { fill: color-mix(in srgb, var(--prod) 30%, var(--prod-soft)); stroke: var(--prod); } .iso-p .fr { fill: color-mix(in srgb, var(--prod) 16%, var(--prod-soft)); stroke: var(--prod); }
.iso-a .ft { fill: var(--accent-soft); stroke: var(--accent); } .iso-a .fl { fill: color-mix(in srgb, var(--accent) 34%, var(--accent-soft)); stroke: var(--accent); } .iso-a .fr { fill: color-mix(in srgb, var(--accent) 18%, var(--accent-soft)); stroke: var(--accent); }
.iso-g .ft { fill: var(--ag-soft); stroke: var(--ag); } .iso-g .fl { fill: color-mix(in srgb, var(--ag) 34%, var(--ag-soft)); stroke: var(--ag); } .iso-g .fr { fill: color-mix(in srgb, var(--ag) 18%, var(--ag-soft)); stroke: var(--ag); }
.iso-o .ft { fill: var(--ok-soft); stroke: var(--ok); } .iso-o .fl { fill: color-mix(in srgb, var(--ok) 34%, var(--ok-soft)); stroke: var(--ok); } .iso-o .fr { fill: color-mix(in srgb, var(--ok) 18%, var(--ok-soft)); stroke: var(--ok); }
.iso-shell .sw { fill: color-mix(in srgb, var(--prod-soft) 55%, transparent); stroke: var(--prod); stroke-width: 1.2; }
.iso-shell .sf { fill: color-mix(in srgb, var(--prod-soft) 80%, transparent); stroke: var(--prod); stroke-width: 1.2; }
.iso-plate .sheet { stroke-width: 1; }
.iso-plate .s-h { fill: var(--surface); stroke: var(--line-strong); }
.iso-plate .s-g { fill: var(--ag-soft); stroke: var(--ag); }
.iso-plate .s-o { fill: var(--ok-soft); stroke: var(--ok); }
.iso-arrow { fill: none; stroke-width: 1.8; }
.iso-arrow.dash { stroke-dasharray: 5 4; }
.ar-k { stroke: var(--ink); } .ar-a { stroke: var(--accent); } .ar-p { stroke: var(--prod); } .ar-g { stroke: var(--ag); } .ar-o { stroke: var(--ok); }
.mh-k { fill: var(--ink); } .mh-a { fill: var(--accent); } .mh-p { fill: var(--prod); } .mh-g { fill: var(--ag); } .mh-o { fill: var(--ok); }
.iso-badge circle { fill: var(--surface); stroke: currentColor; stroke-width: 1.3; color: var(--ink); }
.iso-badge text { font: 700 10.5px var(--font-mono); fill: var(--ink); }
.iso-plate text.h.prod { fill: var(--prod); } .iso-plate text.h.acc { fill: var(--accent); } .iso-plate text.h.ag { fill: var(--ag); }
.iso-plate text.m { fill: var(--ink); font-size: 11.5px; }
.xplate { margin: 1.8em 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 14px 16px 10px; }
.xplate-head { display: flex; align-items: baseline; gap: 10px; font: 700 .74rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.xplate-head b { color: var(--accent); }
.xplate figcaption { font-size: .9rem; color: var(--muted); margin-top: 6px; }

figure.diagram[data-mo] .zx-figbar { display: none; }
.xplate-head .mo-bar { margin: 0 0 0 auto; text-transform: none; letter-spacing: 0; }
.xplate-head { flex-wrap: wrap; align-items: center; }

/* ---------- plates: dark stage, fixed palette (same in light and dark mode) ---------- */
.plate2 { --s-bg: #121524; --s-ink: #e8e9f3; --s-mute: #9096ad; --s-edge: #3c4262;
  --cv: #a99cf5; --cv-f: #252347; --cv-l: #1c1a38; --cv-r: #211f40;
  --ck: #f28fc4; --ck-f: #3d2238; --ck-l: #2c1829; --ck-r: #341d30;
  --cg: #8fe3a3; --cg-f: #1f3a2a; --cg-l: #152a1e; --cg-r: #1a3124;
  --ct: #63d6ca; --ct-f: #173634; --ct-l: #102624; --ct-r: #142e2c;
  --cb: #93b6ff; --cb-f: #1f2b4d; --cb-l: #161f39; --cb-r: #1a2543;
  --ca: #f4c56d; --cy: #e3e46e; --ci: #e8e9f3; }
.plate2 .stage { fill: var(--s-bg); }
.plate2 text { font-family: var(--font-mono); fill: var(--s-ink); font-size: 12.5px; }
.plate2 .kick { font: 700 12.5px var(--font-mono); letter-spacing: .12em; fill: var(--s-ink); }
.plate2 .th { font: 700 14px var(--font-mono); }
.plate2 .td { font: italic 400 13px var(--font-body, Georgia, serif); fill: var(--s-mute); }
.plate2 .tm.sm { font-size: 11.5px; }
.plate2 .mh2 { font: 500 12px var(--font-mono); letter-spacing: .14em; fill: var(--s-mute); }
.plate2 .mv { font: 700 13.5px var(--font-mono); fill: var(--cb); }
.plate2 .cv { fill: var(--cv); } .plate2 .ck { fill: var(--ck); } .plate2 .cg { fill: var(--cg); } .plate2 .ct { fill: var(--ct); }
.plate2 .cb { fill: var(--cb); } .plate2 .ca { fill: var(--ca); } .plate2 .cy { fill: var(--cy); }
.plate2 text.hi { font-weight: 700; fill: var(--ca); }
.plate2 .slab .ft { fill: #1b1f33; stroke: #4b5274; stroke-width: 1.2; }
.plate2 .slab .fl { fill: #12152a; stroke: #4b5274; } .plate2 .slab .fr { fill: #161a2f; stroke: #4b5274; }
.plate2 .bx polygon { stroke-width: 1.3; stroke-linejoin: round; }
.plate2 .bx.cv .ft { fill: var(--cv-f); stroke: var(--cv); } .plate2 .bx.cv .fl { fill: var(--cv-l); stroke: var(--cv); } .plate2 .bx.cv .fr { fill: var(--cv-r); stroke: var(--cv); }
.plate2 .bx.ck .ft { fill: var(--ck-f); stroke: var(--ck); } .plate2 .bx.ck .fl { fill: var(--ck-l); stroke: var(--ck); } .plate2 .bx.ck .fr { fill: var(--ck-r); stroke: var(--ck); }
.plate2 .bx.cg .ft { fill: var(--cg-f); stroke: var(--cg); } .plate2 .bx.cg .fl { fill: var(--cg-l); stroke: var(--cg); } .plate2 .bx.cg .fr { fill: var(--cg-r); stroke: var(--cg); }
.plate2 .bx.ct .ft { fill: var(--ct-f); stroke: var(--ct); } .plate2 .bx.ct .fl { fill: var(--ct-l); stroke: var(--ct); } .plate2 .bx.ct .fr { fill: var(--ct-r); stroke: var(--ct); }
.plate2 .bx.cb .ft { fill: var(--cb-f); stroke: var(--cb); } .plate2 .bx.cb .fl { fill: var(--cb-l); stroke: var(--cb); } .plate2 .bx.cb .fr { fill: var(--cb-r); stroke: var(--cb); }
.plate2 .bx.deck .ft { fill: #20254a; fill-opacity: .85; }
.plate2 .slot { fill: none; stroke: currentColor; stroke-width: 1; opacity: .7; }
.plate2 .bx.ck .slot { stroke: var(--ck); } .plate2 .led { fill: var(--ca); }
.plate2 .scr { stroke: var(--cb); stroke-width: 1.6; stroke-linecap: round; opacity: .8; }
.plate2 .prompt { font: 700 9px var(--font-mono); fill: var(--cb); }
.plate2 .cyl .fs { stroke-width: 1.3; } .plate2 .cyl .ring { fill: none; stroke-width: 1; opacity: .7; }
.plate2 .cyl.ct .fs { fill: var(--ct-l); stroke: var(--ct); } .plate2 .cyl.ct .ring { stroke: var(--ct); } .plate2 .cyl.ct .ft { fill: var(--ct-f); stroke: var(--ct); stroke-width: 1.3; }
.plate2 .sheet { stroke-width: 1.3; fill-opacity: .92; }
